on:
  push:
    paths:
      - "config/*.keymap"
  workflow_dispatch:

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@v0.23.0
    with:
      # Rebase each parse onto the last committed drawing so manual combo
      # positioning (align/offset, to keep the cross-hand combos from
      # overlapping) survives future keymap edits instead of being wiped.
      parse_args: "corne:'-b keymap-drawer/corne.yaml'"

  png:
    needs: draw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Convert SVG to PNG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert --background-color white -o keymap-drawer/corne.png keymap-drawer/corne.svg

      - name: Commit PNG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "keymap-drawer/corne.png"
          commit_message: "keymap-drawer: render PNG"
